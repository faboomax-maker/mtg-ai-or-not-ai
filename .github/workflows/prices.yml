# Prices for the game « Plus cher ou moins cher ? » (docs/data/prix.json) and the cards of the day of
# « Carte mystère » (docs/data/mystere.json), from Scryfall's free
# bulk data. Runs every day at 04:13 UTC (Scryfall refreshes its files every evening), or by hand: Actions tab -> « Mettre à jour les prix » -> Run workflow.
name: Mettre à jour les prix

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prix Scryfall
        run: python pipeline/fetch_prices.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prix.json docs/data/mystere.json
          git commit -m "Prix des cartes du $(date +%F)" || { echo "Rien à publier"; exit 0; }
          git pull --rebase -q origin main
          git push
