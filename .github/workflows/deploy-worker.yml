# Deploys the game server (worker/) to Cloudflare: answers, timer checks, top-10 leaderboards.
# One-time setup: see worker/README.md (secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# QUIZ_ADMIN_TOKEN, LEADERBOARD_GH_TOKEN). Runs on changes under worker/ or by hand.
name: Déployer le serveur de jeu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Game server not set up yet (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID): see worker/README.md"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Base de données D1 (créée si besoin)
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: |
          id=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="mtg-quiz") | .uuid')
          if [ -z "$id" ]; then
            npx --yes wrangler@4 d1 create mtg-quiz
            id=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="mtg-quiz") | .uuid')
          fi
          sed -e "s/__D1_ID__/$id/" -e "s#__GH_REPO__#${{ github.repository }}#" wrangler.toml.template > wrangler.toml
      - name: Déployer
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice::Worker URL: $url  (set it as the repository variable QUIZ_API_URL)"
          echo "Worker URL: \`$url\` — set it as the repository variable **QUIZ_API_URL**" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets du worker
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        env:
          ADMIN: ${{ secrets.QUIZ_ADMIN_TOKEN }}
          GHTOKEN: ${{ secrets.LEADERBOARD_GH_TOKEN }}
        run: |
          [ -n "$ADMIN" ] && printf '%s' "$ADMIN" | npx --yes wrangler@4 secret put ADMIN_TOKEN
          [ -n "$GHTOKEN" ] && printf '%s' "$GHTOKEN" | npx --yes wrangler@4 secret put GH_TOKEN
          true
