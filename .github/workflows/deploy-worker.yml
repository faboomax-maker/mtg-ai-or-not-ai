# Deploys the game server (worker/) to Cloudflare: answers, timer checks, top-10 leaderboards.
# One-time setup: see worker/README.md (secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# QUIZ_ADMIN_TOKEN, LEADERBOARD_GH_TOKEN). Runs on changes under worker/ or by hand.
name: Déployer le serveur de jeu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Game server not set up yet (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID): see worker/README.md"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Base de données D1 (créée si besoin)
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: |
          if ! npx --yes wrangler@4 d1 list --json > d1.json 2> d1.err; then
            cat d1.err
            echo "::error::Cloudflare refused to list D1 databases: the API token needs the permission 'Account > D1 > Edit' for this account, and CLOUDFLARE_ACCOUNT_ID must be that account's id (worker/README.md, step 2)"
            exit 1
          fi
          uuid() { jq -r --arg n "$1" '.[] | select(.name==$n) | .uuid' d1.json; }
          conf() {   # wrangler.toml for database $1 (name) / $2 (id)
            sed -e "s/__D1_NAME__/$1/" -e "s/__D1_ID__/$2/" -e "s#__GH_REPO__#${{ github.repository }}#" wrangler.toml.template > wrangler.toml
          }
          # the database lives in Western Europe, next to the players (every answer queries it)
          eu=$(uuid mtg-quiz-eu)
          if [ -z "$eu" ]; then
            npx --yes wrangler@4 d1 create mtg-quiz-eu --location weur
            npx --yes wrangler@4 d1 list --json > d1.json
            eu=$(uuid mtg-quiz-eu)
          fi
          conf mtg-quiz-eu "$eu"
          # one-time move of decks, leaderboards and games from the first database (kept as is),
          # done again as long as the new one has no deck (e.g. if a previous move failed)
          decks=$(npx --yes wrangler@4 d1 execute mtg-quiz-eu --remote --json \
                   --command "SELECT COUNT(*) AS n FROM decks" 2>/dev/null | jq -r '.[0].results[0].n' || true)
          old=$(uuid mtg-quiz)
          if [ -n "$old" ] && { [ -z "$decks" ] || [ "$decks" = "null" ] || [ "$decks" = "0" ]; }; then
            conf mtg-quiz "$old"
            npx --yes wrangler@4 d1 export mtg-quiz --remote --output dump.sql
            conf mtg-quiz-eu "$eu"
            npx --yes wrangler@4 d1 execute mtg-quiz-eu --remote --command "DROP TABLE IF EXISTS decks; DROP TABLE IF EXISTS games; DROP TABLE IF EXISTS scores" --yes
            npx --yes wrangler@4 d1 execute mtg-quiz-eu --remote --file dump.sql --yes
            echo "::notice::D1 database moved to Western Europe (mtg-quiz -> mtg-quiz-eu)"
          fi
      - name: Déployer
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice::Worker URL: $url  (set it as the repository variable QUIZ_API_URL)"
          echo "Worker URL: \`$url\` — set it as the repository variable **QUIZ_API_URL**" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets du worker
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        env:
          ADMIN: ${{ secrets.QUIZ_ADMIN_TOKEN }}
          GHTOKEN: ${{ secrets.LEADERBOARD_GH_TOKEN }}
        run: |
          [ -n "$ADMIN" ] && printf '%s' "$ADMIN" | npx --yes wrangler@4 secret put ADMIN_TOKEN
          [ -n "$GHTOKEN" ] && printf '%s' "$GHTOKEN" | npx --yes wrangler@4 secret put GH_TOKEN
          true
