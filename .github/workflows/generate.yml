# Regenerates the card pool directly on GitHub (no local setup needed).
# Actions tab -> "Générer les cartes" -> Run workflow.
# Requires the API keys as repository secrets (Settings -> Secrets and variables -> Actions).
name: Générer les cartes

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre de cartes de chaque type (vraies / IA)"
        default: "60"
      llm:
        description: "Fournisseur texte (openai | anthropic)"
        default: "openai"
      images:
        description: "Fournisseur images (replicate | openai | pollinations | placeholder)"
        default: "replicate"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vraies cartes (Scryfall)
        run: python pipeline/fetch_real.py --count ${{ inputs.count }}
      - name: Cartes IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Accepted either as a variable or as a secret.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python pipeline/generate_fake.py --count ${{ inputs.count }} --llm ${{ inputs.llm }} --images ${{ inputs.images }}
      - name: Sauvegarder les images IA (originaux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-ia
          path: pipeline/work/raw/
          if-no-files-found: ignore
      - name: Construire le site
        run: python pipeline/build.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Nouveau jeu de cartes (${{ inputs.count }} + ${{ inputs.count }})" || echo "Rien à publier"
          git push
