# Regenerates the card pool directly on GitHub (no local setup needed).
# Actions tab -> "Générer les cartes" -> Run workflow.
# Requires the API keys as repository secrets (Settings -> Secrets and variables -> Actions).
# The form picks the game mode whose card pool is regenerated (normal: recent cards, more rares;
# hardcore: mostly commons from every era), and optionally overrides that mode's eras/rarities.
# With the game server (repository variable QUIZ_API_URL, see worker/README.md), the answers
# are sent to it instead of being published with the cards: leaderboards and timer checks.
# Big requests are split into chunks of 50 + 50 cards made by parallel jobs (up to 6 at a
# time), then merged into the deck; "ajouter" adds them to the deck instead of replacing it.
name: Générer les cartes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de jeu dont les cartes sont régénérées"
        type: choice
        options: [normal, hardcore]
        default: normal
      count:
        description: "Nombre de cartes de chaque type (vraies / IA), découpé en morceaux de 50"
        default: "20"
      append:
        description: "Ajouter au paquet existant (sinon il est remplacé)"
        type: boolean
        default: false
      eras:
        description: "Époques (vide = celles du mode ; ex. old=1,modern=1,current=1)"
        default: ""
      rarities:
        description: "Raretés (vide = celles du mode ; ex. common=55,uncommon=40,rare=4,mythic=1)"
        default: ""
      art:
        description: "Illustrations des cartes IA : real = art de la vraie carte copiée, generate = modèle d'images"
        type: choice
        options: [real, generate]
        default: real
      llm:
        description: "Fournisseur texte"
        type: choice
        options: [openai, anthropic]
        default: openai
      images:
        description: "Fournisseur images (seulement si illustrations = generate)"
        type: choice
        options: [fal, replicate, openai, pollinations, placeholder]
        default: fal

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      per: ${{ steps.plan.outputs.per }}
    steps:
      - id: plan
        run: |
          count=${{ inputs.count }}
          n=$(( (count + 49) / 50 )); [ "$n" -lt 1 ] && n=1
          per=$(( (count + n - 1) / n ))
          echo "chunks=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
          echo "per=$per" >> "$GITHUB_OUTPUT"
          echo "$count cards of each type: $n chunk(s) of $per" >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: plan
    name: morceau ${{ matrix.chunk }}
    runs-on: windows-latest          # Magic Set Editor is a Windows program
    timeout-minutes: 150            # older frame eras spread the cards over more sets
    strategy:
      fail-fast: false               # a failed chunk doesn't stop the others
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    env:
      PYTHONUTF8: "1"                # card names/text contain — ’ etc.
      # the form's values, else the mode's mix: normal = recent cards (M15 frame) with more rares
      # and mythics; hardcore = mostly commons, every era
      RARITY_WEIGHTS: ${{ inputs.rarities || (inputs.mode == 'hardcore' && 'common=80,uncommon=20,rare=0,mythic=0' || 'common=25,uncommon=35,rare=30,mythic=10') }}
      ERA_WEIGHTS: ${{ inputs.eras || (inputs.mode == 'hardcore' && 'old=1,modern=1,current=1' || 'old=0,modern=0,current=1') }}
      # AI cards illustrations: real (default: art of the real card they copy) or generate
      ART_SOURCE: ${{ inputs.art || vars.ART_SOURCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Magic Set Editor (cadres M15)
        run: ./pipeline/setup_mse.ps1 -Dir mse
      - name: Vraies cartes (Scryfall)
        env:
          # the text of each real card is read on its scan (italics as printed)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}
        run: python pipeline/fetch_real.py --count ${{ needs.plan.outputs.per }}
      - name: Cartes IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Accepted either as a variable or as a secret.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
          IMAGE_SIZE: ${{ vars.IMAGE_SIZE }}
          # Replicate model, e.g. black-forest-labs/flux-1.1-pro (default: flux-schnell)
          REPLICATE_MODEL: ${{ vars.REPLICATE_MODEL || secrets.REPLICATE_MODEL }}
          # LoRA for *-lora models (default: Light Fantasy on flux-2-klein-4b-base-lora)
          LORA_URL: ${{ vars.LORA_URL }}
          LORA_SCALE: ${{ vars.LORA_SCALE }}
          LORA_TRIGGER: ${{ vars.LORA_TRIGGER }}
          IMAGE_MEGAPIXELS: ${{ vars.IMAGE_MEGAPIXELS }}
          # images tried per AI card (each checked by the vision model), 1 = no check
          ART_TRIES: ${{ vars.ART_TRIES }}
          # reference images: mix (2 set illustrations + 1 public-domain painting), set, classic
          STYLE_REFS: ${{ vars.STYLE_REFS }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # fal.ai (images = fal): FLUX.2 klein base + LoRA with the steps it needs
          FAL_MODEL: ${{ vars.FAL_MODEL }}
          FAL_STEPS: ${{ vars.FAL_STEPS }}
          FAL_GUIDANCE: ${{ vars.FAL_GUIDANCE }}
          FAL_IMAGE_SIZE: ${{ vars.FAL_IMAGE_SIZE }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python pipeline/generate_fake.py --count ${{ needs.plan.outputs.per }} --llm ${{ inputs.llm }} --images ${{ inputs.images }}
      - name: Sauvegarder les images IA (originaux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-ia-${{ matrix.chunk }}
          path: pipeline/work/raw/
          retention-days: 7
          if-no-files-found: ignore
      - name: Rendu des cartes (Magic Set Editor)
        env:
          MSE_DIR: ${{ github.workspace }}/mse
        run: python pipeline/render_mse.py
      - name: Préparer le morceau
        env:
          QUIZ_ADMIN_TOKEN: ${{ secrets.QUIZ_ADMIN_TOKEN }}     # seals the chunk's answers
        run: python pipeline/build.py --chunk out/chunk
      - name: Envoyer le morceau
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: out/chunk/
          retention-days: 1          # (artifacts of a public repo can be downloaded)

  publish:
    needs: [plan, generate]
    if: ${{ !cancelled() }}          # publish the chunks that succeeded
    runs-on: ubuntu-latest
    concurrency: publish-cards       # one deck update at a time (both modes share the site)
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Récupérer les morceaux
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
      - name: Construire le site
        env:
          # with the game server, the answers stay out of the published deck
          LEADERBOARD: ${{ vars.QUIZ_API_URL != '' && '1' || '' }}
          QUIZ_API_URL: ${{ vars.QUIZ_API_URL }}
          QUIZ_ADMIN_TOKEN: ${{ secrets.QUIZ_ADMIN_TOKEN }}
        run: |
          git pull -q origin main        # the latest deck, when adding to it
          python pipeline/build.py --mode ${{ inputs.mode }} --merge chunks/* --expected ${{ inputs.count }} ${{ inputs.append && '--append' || '' }}
      - name: Envoyer les réponses au serveur de jeu
        if: vars.QUIZ_API_URL != ''
        env:
          QUIZ_API_URL: ${{ vars.QUIZ_API_URL }}
          QUIZ_ADMIN_TOKEN: ${{ secrets.QUIZ_ADMIN_TOKEN }}
        run: python pipeline/upload_deck.py --mode ${{ inputs.mode }}
      - name: Publier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "${{ inputs.append && 'Cartes ajoutées' || 'Nouveau jeu de cartes' }} ${{ inputs.mode }} (${{ inputs.count }} + ${{ inputs.count }} demandées)" || echo "Rien à publier"
          git pull --rebase -q origin main    # the game server commits the leaderboard too
          git push
